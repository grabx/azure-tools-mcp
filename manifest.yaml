apiVersion: apps/v1
kind: Deployment
metadata:
  name: azure-tools-mcp
  labels:
    app.kubernetes.io/name: azure-tools-mcp
    app.kubernetes.io/component: mcp-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: azure-tools-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: azure-tools-mcp
        app.kubernetes.io/component: mcp-server
    spec:
      containers:
        - name: azure-tools-mcp
          # Replace with your registry/image and pinned version or digest.
          image: <REGISTRY>/<NAMESPACE>/azure-tools-mcp:<TAG>
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8000
              protocol: TCP

          env:
            - name: PORT
              value: "8000"

          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 2
            failureThreshold: 3

          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault

---
apiVersion: v1
kind: Service
metadata:
  name: azure-tools-mcp
  labels:
    app.kubernetes.io/name: azure-tools-mcp
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: azure-tools-mcp
  ports:
    - name: http
      protocol: TCP
      port: 8000
      targetPort: http